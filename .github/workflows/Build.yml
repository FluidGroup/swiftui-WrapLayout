name: Build

on:
  push:
    branches: "**"
  pull_request:
    branches: "**"

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: maxim-lobanov/setup-xcode@v1.1
        with:
          xcode-version: "26.4"
      - uses: actions/checkout@v4
      - name: xcodebuild
        run: xcodebuild -scheme WrapLayout -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
  test:
    runs-on: macos-26

    steps:
      - uses: maxim-lobanov/setup-xcode@v1.1
        with:
          xcode-version: "26.4"
      - uses: actions/checkout@v4

      - name: Clear snapshots to force re-record
        run: rm -rf Tests/WrapLayoutTests/__Snapshots__

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -scheme WrapLayout -resultBundlePath results/WrapLayout.xcresult test -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' -derivedDataPath ./DerivedData | xcpretty

      - name: Upload snapshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-failures
          path: |
            Tests/WrapLayoutTests/__Snapshots__/**
            /tmp/WrapLayoutTests/**
          if-no-files-found: ignore
