name: Build

on:
  push:
    branches: "**"
  pull_request:
    branches: "**"

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: maxim-lobanov/setup-xcode@v1.1
        with:
          xcode-version: "26.4"
      - uses: actions/checkout@v4
      - name: xcodebuild
        run: xcodebuild -scheme WrapLayout -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.4'
  test:
    runs-on: macos-26

    steps:
      - uses: maxim-lobanov/setup-xcode@v1.1
        with:
          xcode-version: "26.4"
      - uses: actions/checkout@v4

      - name: Test
        run: xcodebuild -scheme WrapLayout -resultBundlePath results/WrapLayout.xcresult test -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.4' -derivedDataPath ./DerivedData | xcpretty
